# This configuration file is used to set user specific settings for this project.
# Make adjustments to all settings where needed and save this file as:
# ./config.yaml

## Preparation ------------------

#. 1 Do you want to automatically install packages that are required for this project?
install_packages: "Y"   # choose Y or N

#. 2 Do you want debug messages during the execution of functions?
debug_messages: "Y"     # choose Y on N

# 3. Path to your local Miniconda installation.
# Example: "/home/username/miniconda3"
miniconda_path: "~/ProgramFiles/miniconda3"

# 4. Name of the conda environment where pcraster is installed
# Example: "lisem"
conda_env: "lisem"

# 5. List of subcatchment numbers to analyse.
# see the file /sources/setup/outpoints_description.csv
# for subcatchment names and numbers.
# WARNING: 1 = the whole catchment - very long processing times
# Subcatchments for calibration are: Gulp = 4, Kelmis = 18 and Eyserbeek = 14.
# For testing of NBS 6 small catchments [52, 54, 55, 56, 57, 58] are used.
# You can specify one or more numbers, e.g. [10, 12, 18]
subcatchments: [4, 18]

# 6. resolution to work on, available are 5 , 10 and 20, multiple is also possible, default = 10
resolution: [10]

# 7. Number of cpu cores assigned to the lisem model.
# -1 = 50% of available cores assigned
# 0 = all available cores assigned - with GUI can give instability!
cpu_cores: [2]

## Run settings (used by interactive_run.R and can be set manually) -----------

# 8. Type of LISEM run.
# "cal" = date-specific calibration simulations
# "base" = standard events for NBS scenario simulations
run_type: "cal"

# 9. NBS land-use number to include in the run.
# 0 = no NBS (base run); other values correspond to entries in
# sources/setup/tables/lu_NBS_tbl.csv
NBS_num: 0

# 10. Initial soil moisture calibration factor.
# Only meaningful when run_type = "cal".
# Factor applied over the initial hydraulic head of the whole catchment.
inithcal: 1.0
